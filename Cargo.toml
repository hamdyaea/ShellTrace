[package]
name = "shelltrace"
version = "0.1.0"
edition = "2021"
authors = ["Hamdy Abou El Anein"]
description = "Evidence-based Linux command tracing with filesystem snapshots and optional sandbox execution"
license = "GPL-3.0-or-later"
repository = "https://github.com/hamdyaea/ShellTrace"
readme = "README.md"
keywords = ["linux", "strace", "forensics", "security", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
rust-version = "1.76"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
