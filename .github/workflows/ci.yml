name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, Clippy, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format source for CI
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install integration-test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace bubblewrap
      - name: Tests
        run: cargo test --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release

  qt6-desktop:
    name: Qt6 desktop build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build g++ qt6-base-dev
      - name: Configure Qt6 GUI
        run: cmake -S gui -B build/gui -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile Qt6 GUI
        run: cmake --build build/gui --parallel
      - name: Headless UI startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/gui/shelltrace-gui --self-test
